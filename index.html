<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bca687">
<meta name="description" content="Catálogo pessoal de semi jóias com controle de vendas.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Olivir">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Catálogo Olivir</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: phone-first catalogue. Sticky wordmark bar, one quiet totals line,
   photo-led grid, and a bottom sheet (dialog) for the piece and its sale notes. */
:root{
  --bg:#fdfbf7;
  --surface:#f5eee2;
  --surface-2:#ebe2d2;
  --ink:#2f261b;
  --muted:#6a5a46;
  --line:#e3d9c7;
  --field-line:#9a8870;
  --gold:#bca687;
  --on-gold:#2a2118;
  --gold-text:#6e5636;
  --cream:#fef6e9;
  --ok:#2f6b4a;
  --err:#a8321f;
  --on-err:#ffffff;
  --shadow:rgba(47,38,27,.25);
  --r:8px;
  --card:#f5eee2;
  --neu:7px 7px 18px rgba(120,96,62,.13),-7px -7px 18px rgba(255,255,255,.95);
  --neu-hover:9px 9px 22px rgba(120,96,62,.17),-9px -9px 22px #ffffff;
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1812;--surface:#27211a;--surface-2:#342c22;--ink:#f4ede1;--muted:#b3a48d;--line:#3a3227;
    --field-line:#7c6d58;--gold:#bca687;--on-gold:#231c13;--gold-text:#d3bf9f;--ok:#8fc59b;--err:#ff9a87;
    --on-err:#2a0d08;--shadow:rgba(0,0,0,.6);color-scheme:dark;
    --card:#27211a;--neu:7px 7px 18px #15110c,-7px -7px 18px #2f271e;--neu-hover:9px 9px 22px #15110c,-9px -9px 22px #342c22;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1812;--surface:#27211a;--surface-2:#342c22;--ink:#f4ede1;--muted:#b3a48d;--line:#3a3227;
  --field-line:#7c6d58;--gold:#bca687;--on-gold:#231c13;--gold-text:#d3bf9f;--ok:#8fc59b;--err:#ff9a87;
  --on-err:#2a0d08;--shadow:rgba(0,0,0,.6);color-scheme:dark;
  --card:#27211a;--neu:7px 7px 18px #15110c,-7px -7px 18px #2f271e;--neu-hover:9px 9px 22px #15110c,-9px -9px 22px #342c22;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100%}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,dl,dd{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px}

/* Bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:46px;height:46px;flex:none;display:block}
.brand-lock{display:grid;gap:7px;min-width:0}
.brand-word{display:block;height:24px;width:auto;fill:var(--ink)}
.brand-sub{display:block;font-size:10px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);line-height:1;padding-left:2px}
.brand-tag{display:none;font-size:13px;color:var(--muted);margin-left:10px}
@media(min-width:720px){.brand-tag{display:block}.brand-word{height:28px}.brand-sub{font-size:11px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;transition:transform .12s ease,background-color .2s ease,border-color .2s ease}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:default}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-gold:hover:not([disabled]){background:color-mix(in srgb,var(--gold) 88%,var(--ink))}
.btn-ghost{background:transparent;border-color:var(--field-line);color:var(--ink)}
.btn-ghost:hover:not([disabled]){background:var(--surface-2)}
.btn-danger{background:var(--err);color:var(--on-err)}
.link{background:none;border:0;padding:10px 4px;min-height:44px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.link:hover{color:var(--ink)}

/* Page */
main{max-width:1240px;margin:0 auto;padding-block:8px 40px}
.notice{margin:14px 0 0;padding:10px 12px;border:1px solid var(--field-line);border-radius:var(--r);font-size:14px;color:var(--ink);background:var(--surface)}
.totals{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:10px clamp(8px,2.6vw,40px);padding-block:22px 4px}
.totals>div{display:grid;gap:2px;min-width:0}
@media (max-width:560px){.totals .lbl{font-size:10px;letter-spacing:.04em}.totals .num{font-size:clamp(11px,3.5vw,16px);letter-spacing:-.02em;white-space:nowrap}}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.controls{display:grid;gap:12px;padding-block:16px 24px;position:relative;z-index:1}
@media(min-width:720px){.controls{grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px}}
.field{display:grid;gap:6px;min-width:0}
.field>label,legend{font-size:13px;font-weight:600}
.help{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--err);font-weight:500}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--field-line);border-radius:var(--r);background:var(--bg);font-size:16px}
textarea{resize:vertical;min-height:112px;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:46px;padding:0 14px;border:1px solid var(--field-line);background:transparent;border-radius:var(--r);font-weight:500;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--font-mono);font-size:12px;opacity:.75;margin-left:6px}

/* Grid */
.grid{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 16px;padding-bottom:24px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{display:grid;gap:5px;width:100%;min-width:0;text-align:left;background:var(--card);border:0;padding:12px;cursor:pointer;align-content:start;border-radius:31px;box-shadow:var(--neu);height:100%;transition:box-shadow .3s ease,transform .12s ease}
.grid>li{display:flex}
@media(hover:hover){.tile:hover{box-shadow:var(--neu-hover)}}
.t-photo{display:block;aspect-ratio:4/5;border-radius:19px;overflow:hidden;background:var(--surface-2);margin-bottom:4px}
.t-photo img,.s-photo img,.pf-frame img{display:block;width:100%;height:100%;object-fit:cover}
.t-photo img{transition:transform .5s cubic-bezier(.16,1,.3,1),filter .3s ease,opacity .3s ease}
.tile:hover .t-photo img{transform:scale(1.03)}
.tile:active{transform:scale(.985)}
.tile.is-sold .t-photo img{filter:grayscale(.9);opacity:.55}
.noimg{display:grid;place-items:center;width:100%;height:100%;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.t-name{min-height:2.6em;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.t-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.t-code{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.t-price{font-family:var(--font-mono);font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums}
.tile.is-sold .t-price{color:var(--muted)}
.t-comm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);margin-top:-2px}
.t-comm span,.s-comm span{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.s-comm{font-size:14px;color:var(--muted)}
.t-status{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.t-status.ok{color:var(--ok);font-weight:600}
.t-due{font-size:12.5px;color:var(--muted)}

/* States */
.state{max-width:760px;padding-block:40px 24px}
.empty{display:grid;gap:26px;align-items:center;justify-items:start}
@media(min-width:720px){.empty{grid-template-columns:auto minmax(0,1fr);gap:44px}}
.badge{display:block;width:min(100%,230px);height:auto;flex:none}
.state h2{font-family:var(--font-display);font-weight:600;font-size:36px;line-height:1.05;text-wrap:balance}
.state p{color:var(--muted);margin:12px 0 22px;max-width:46ch}
.sk{display:grid;gap:8px}
.sk-ph,.sk-l{display:block;border-radius:var(--r);background:var(--surface-2)}
.sk-ph{aspect-ratio:4/5}
.sk-l{height:12px;width:80%}
.sk-l.s{width:45%}
@media(prefers-reduced-motion:no-preference){
  .sk-ph,.sk-l{background:linear-gradient(100deg,var(--surface-2) 30%,var(--surface) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
  @keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
  .s-in{animation:sheetIn .35s cubic-bezier(.16,1,.3,1)}
  @keyframes sheetIn{from{transform:translateY(22px)}to{transform:none}}
}
.ro .bar [data-act="new"]{display:none}
.foot{max-width:1240px;margin:0 auto;padding-block:8px 36px}

/* Sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(960px,calc(100% - 32px));max-width:100%;max-height:100dvh;overflow:auto;border-radius:var(--r);box-shadow:0 30px 80px var(--shadow)}
dialog::backdrop{background:rgba(24,17,9,.62)}
@media(max-width:719px){dialog{width:100%;margin:auto 0 0 0;max-height:94dvh;border-radius:var(--r) var(--r) 0 0}}
.s-grid{display:grid;gap:20px;padding:18px max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:720px){.s-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;padding:26px 28px 30px}}
.s-photo,.pf-frame{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--surface-2);max-height:52dvh;width:100%}
@media(min-width:720px){.s-photo,.pf-frame{max-height:none}}
.s-main{display:grid;gap:12px;align-content:start;min-width:0}
.s-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.s-status{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.s-status.ok{color:var(--ok)}
.s-name{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.05;overflow-wrap:anywhere;text-wrap:balance}
.s-code{font-family:var(--font-mono);font-size:14px;color:var(--muted)}
.s-price{font-family:var(--font-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.sale{display:grid;grid-template-columns:minmax(96px,128px) minmax(0,1fr);gap:10px 14px;margin:6px 0 2px;padding-top:14px;border-top:1px solid var(--line)}
.sale dt{font-size:13px;color:var(--muted)}
.sale dd{overflow-wrap:anywhere;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.confirm{display:grid;gap:12px;padding:14px;border:1px solid var(--field-line);border-radius:var(--r);margin-top:8px}
.form{display:grid;gap:16px;min-width:0}
.form h3{font-family:var(--font-display);font-weight:600;font-size:25px;line-height:1.1}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg label{display:grid;place-items:center;min-height:46px;border:1px solid var(--field-line);border-radius:var(--r);cursor:pointer;font-weight:500;background:var(--bg);text-align:center;padding:0 6px}
.seg input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+label{outline:2px solid var(--gold-text);outline-offset:2px}
.pf-col{display:grid;gap:12px;align-content:start}
.pf-col .btn{width:100%}
.pf-pick:focus-visible+label{outline:2px solid var(--gold-text);outline-offset:2px}

/* Login */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px}
.login form{display:grid;gap:16px;width:min(380px,100%)}
.login h2{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.05}
/* Review */
#review .rv{display:grid;gap:14px;padding:20px max(16px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#review h2{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.05}
.rv-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rv-row{display:grid;grid-template-columns:auto 56px minmax(0,1fr);gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);cursor:pointer;min-height:64px}
.rv-row.keep{border-color:var(--gold-text)}
.rv-row input{width:22px;height:22px;accent-color:var(--gold-text);margin:0}
.rv-th{width:56px;height:56px;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.rv-th img{display:block;width:100%;height:100%;object-fit:cover}
.rv-n{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.rv-m{font-size:12.5px;color:var(--muted)}
.rv-tag{font-size:12px;font-weight:600;color:var(--gold-text);text-transform:uppercase;letter-spacing:.06em}
.rv-sum{font-size:14px;font-weight:600}
.rv-act{display:grid;gap:10px}
.rv-tools{display:flex;flex-wrap:wrap;gap:4px 16px}
@media(min-width:720px){#review{width:min(640px,calc(100% - 32px))}}
/* Menu */
.menu-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;border-radius:var(--r);cursor:pointer;color:var(--ink);margin-left:-8px}
.menu-btn:hover{background:var(--surface-2)}
#menu{width:min(340px,86vw);height:100dvh;max-height:100dvh;margin:0;inset:0 auto 0 0;border-radius:0 var(--r) var(--r) 0}
@media(prefers-reduced-motion:no-preference){#menu[open]{animation:drawerIn .3s cubic-bezier(.16,1,.3,1)}@keyframes drawerIn{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}}}
.mn{display:grid;gap:14px;align-content:start;padding:18px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.mn-top{display:flex;justify-content:space-between;align-items:center}
.mn-title{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1}
.mn-list{display:grid;gap:8px}
.mn-item{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font-weight:600;font-size:16px;text-align:left;text-decoration:none;cursor:pointer}
.mn-item:hover{background:var(--surface-2)}
.mn-item small{font-weight:400;font-size:13px;color:var(--muted)}
.mn-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.mn h2{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.05}
/* Extras, galeria, pagamentos, avisos */
.s-col{display:grid;gap:8px;align-content:start;min-width:0}
.gal{display:flex;gap:8px}
.gal button{width:56px;height:56px;padding:0;border:2px solid transparent;border-radius:var(--r);overflow:hidden;background:var(--surface-2);cursor:pointer}
.gal button[aria-pressed=true]{border-color:var(--gold-text)}
.gal img{display:block;width:100%;height:100%;object-fit:cover}
.pf-extras{display:flex;flex-wrap:wrap;gap:8px}
.pf-x{position:relative;width:64px;height:64px;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.pf-x img{display:block;width:100%;height:100%;object-fit:cover}
.pf-x button{position:absolute;right:2px;top:2px;width:26px;height:26px;border:0;border-radius:50%;background:var(--ink);color:var(--bg);font-size:16px;line-height:1;cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;min-height:46px;font-weight:500;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--gold-text);margin:0}
.paynote,.bknote{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin:14px 0 0;padding:12px 14px;border:1px solid var(--field-line);border-radius:var(--r);background:var(--surface);text-align:left;color:var(--ink)}
.paynote{cursor:pointer}
.paynote b{font-family:var(--font-mono);font-weight:500}
.paynote .sub{display:block;font-size:13px;color:var(--muted)}
.paynote .sub.bad{color:var(--err);font-weight:600}
.bknote{flex-wrap:wrap}
.bknote p{font-size:14px;flex:1 1 220px}
.bknote .acts{display:flex;gap:6px;align-items:center}
.t-status.res{color:var(--gold-text);font-weight:600}
.s-status.res{color:var(--gold-text)}
.due-bad{color:var(--err);font-weight:600}
select{appearance:auto;cursor:pointer}
@media(max-width:560px){
  .controls .chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .controls .chip{display:grid;justify-items:center;align-content:center;gap:2px;min-height:54px;padding:6px 2px;font-size:12px;letter-spacing:-.01em}
  .controls .chip .n{margin:0}
}
@media(max-width:420px){
  .bar-in{gap:8px}
  .brand{gap:8px}
  .brand-mark{width:40px;height:40px}
  .brand-word{height:20px}
  .brand-sub{font-size:9px;letter-spacing:.3em}
  .bar .btn{padding:0 12px;font-size:14px}
  .menu-btn{margin-left:-10px}
}
/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--r);font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:30}
</style>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var money=function(n){return brl.format(n||0)};
var commission=function(n){return Math.round((n||0)*100*0.4)/100};
var CATS=[['anel','Anéis'],['brinco','Brincos'],['cordao','Cordões e colares'],['pulseira','Pulseiras'],['outros','Outros']];
var CAT_RULES=[['anel',/\b(anel|aneis|alianca|solitario)/],['brinco',/\b(brinco|argola|ear)/],['cordao',/\b(colar|cordao|cordoes|corrente|gargantilha|choker|pingente)/],['pulseira',/\b(pulseira|bracelete|braceleira|tornozeleira)/]];
function catOf(p){
  if(p.category&&CATS.some(function(c){return c[0]===p.category}))return p.category;
  var n=String(p.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  for(var i=0;i<CAT_RULES.length;i++)if(CAT_RULES[i][1].test(n))return CAT_RULES[i][0];
  return 'outros';
}
var norm=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()};
function fmtDate(iso){
  if(!iso)return '';
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if(m)return m[3]+'/'+m[2]+'/'+m[1];
  var d=new Date(iso);
  return isNaN(d)?'':d.toLocaleDateString('pt-BR');
}
function parsePrice(raw){
  var s=String(raw||'').replace(/[^\d.,]/g,'');
  if(!s)return NaN;
  if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=parseFloat(s);
  return isFinite(n)?Math.round(n*100)/100:NaN;
}
var priceField=function(n){return n==null?'':Number(n).toFixed(2).replace('.',',')};
var METHODS={pix:'Pix',avista:'À vista',parcelado:'Parcelado'};
function methodLabel(sale){
  if(!sale||!sale.method)return '';
  return sale.method==='parcelado'?('Parcelado em '+(sale.installments||'')+'x'):METHODS[sale.method];
}
function newId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
var clone=function(o){return JSON.parse(JSON.stringify(o))};

/* ---------- Offline cache (IndexedDB): photos and the last list, kept on this device ---------- */
var photoURL={},recent={},idbP=null,CLOUD_FLAG='ouro-offir:cloud-seen';
function idb(){
  if(idbP)return idbP;
  idbP=new Promise(function(res,rej){
    try{
      var r=indexedDB.open('ouro-offir',1);
      r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('fotos');d.createObjectStore('meta')};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
  return idbP;
}
function idbReq(store,mode,fn){
  return idb().then(function(d){return new Promise(function(res,rej){
    var t=d.transaction(store,mode),rq=fn(t.objectStore(store));
    t.oncomplete=function(){res(rq&&rq.result)};t.onerror=t.onabort=function(){rej(t.error)};
  })});
}
function cachePut(id,blob){
  return idbReq('fotos','readwrite',function(s){s.put(blob,id)}).then(function(){
    if(photoURL[id])URL.revokeObjectURL(photoURL[id]);
    photoURL[id]=URL.createObjectURL(blob);recent[id]=Date.now();
  }).catch(function(){});
}
function cacheDel(id){
  if(photoURL[id]){URL.revokeObjectURL(photoURL[id]);delete photoURL[id]}
  idbReq('fotos','readwrite',function(s){s.delete(id)}).catch(function(){});
}
function cacheLoad(){
  return idb().then(function(d){return new Promise(function(res){
    var out={},t=d.transaction('fotos','readonly'),c=t.objectStore('fotos').openCursor();
    c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}};
    t.oncomplete=function(){res(out)};t.onerror=function(){res({})};
  })}).then(function(o){Object.keys(o).forEach(function(id){photoURL[id]=URL.createObjectURL(o[id])})}).catch(function(){});
}
function cachePrune(keep){
  idb().then(function(d){
    var t=d.transaction('fotos','readwrite'),c=t.objectStore('fotos').openCursor();
    c.onsuccess=function(){
      var cur=c.result;if(!cur)return;
      if(!keep[cur.key]&&!(recent[cur.key]&&Date.now()-recent[cur.key]<60000)){
        if(photoURL[cur.key]){URL.revokeObjectURL(photoURL[cur.key]);delete photoURL[cur.key]}
        cur.delete();
      }
      cur.continue();
    };
  }).catch(function(){});
}
var metaPut=function(list){return idbReq('meta','readwrite',function(s){s.put(list,'pecas')}).catch(function(){})};
var metaGet=function(){return idbReq('meta','readonly',function(s){return s.get('pecas')}).catch(function(){return null})};
var warming=false,warmAgain=false;
async function warm(){
  if(warming){warmAgain=true;return}
  warming=true;
  try{
    do{
      warmAgain=false;
      var list=S.pieces.slice();
      for(var i=0;i<list.length;i++){
        var id=list[i].photoId;
        if(!id||photoURL[id])continue;
        try{var r=await fetch(blobUrl(id),{credentials:'same-origin'});if(r.ok)await cachePut(id,await r.blob())}catch(e){}
      }
    }while(warmAgain);
  }finally{warming=false}
}

/* ---------- Storage: account (db + assets) or this browser only ---------- */
var LS_KEY='ouro-offir:pecas:v1';
var store={mode:'loading',col:null,assets:null,downloads:null,fb:null};
var CFG=window.OLIVIR_CONFIG||{};
var blobUrl=function(id){return '/_blob/'+id};
function askLogin(auth){
  return new Promise(function(res){
    var d=document.createElement('div');d.className='login';
    d.innerHTML='<form novalidate><h2>Entrar</h2><p class="help">Área do vendedor. Entre uma vez e este aparelho continua conectado.</p>'
      +'<div class="field"><label for="lg-e">E-mail</label><input id="lg-e" type="email" autocomplete="username" inputmode="email"></div>'
      +'<div class="field"><label for="lg-p">Senha</label><input id="lg-p" type="password" autocomplete="current-password"></div>'
      +'<p class="err" id="lg-err" role="alert"></p><button class="btn btn-gold" type="submit">Entrar</button></form>';
    document.body.appendChild(d);
    var f=d.querySelector('form'),er=d.querySelector('#lg-err');
    f.addEventListener('submit',async function(ev){
      ev.preventDefault();er.textContent='';
      try{await auth.signInWithEmailAndPassword(d.querySelector('#lg-e').value.trim(),d.querySelector('#lg-p').value)}
      catch(e){er.textContent=(e&&e.code==='auth/network-request-failed')?'Sem conexão. Tente de novo.':'E-mail ou senha incorretos.';return}
      d.remove();res();
    });
  });
}
function fbDoc(id,d){var o=d||{};return {id:id,name:o.name,code:o.code,price:Number(o.price),photoId:null,photoData:o.photoData||null,createdAt:o.createdAt,reviewedAt:o.reviewedAt||null,category:o.category||'',sold:!!o.sold,reserved:!!o.reserved&&!o.sold,reservedFor:'',photoExtra:Array.isArray(o.photoExtra)?o.photoExtra:[],sale:null}}
async function fbSave(p){
  await store.fb.collection('pecas').doc(p.id).set({name:p.name,code:p.code,price:p.price,photoData:p.photoData||null,sold:!!p.sold,reserved:!!p.reserved&&!p.sold,category:p.category||'',photoExtra:p.photoExtra||[],createdAt:p.createdAt||new Date().toISOString(),reviewedAt:p.reviewedAt||null});
  var v=store.fb.collection('vendas').doc(p.id);
  if(p.sold&&p.sale)await v.set(clone(p.sale));
  else if(p.reserved&&p.reservedFor)await v.set({reservedFor:p.reservedFor});
  else await v.delete();
}
async function fbMigrate(){
  var list=[];try{var raw=localStorage.getItem(LS_KEY);list=raw?JSON.parse(raw):[]}catch(e){}
  if(!list.length)return;
  try{for(var i=0;i<list.length;i++)await fbSave(list[i]);localStorage.removeItem(LS_KEY)}catch(e){}
}
async function initFb(){
  var fc=CFG.firebase;
  if(!(fc&&fc.apiKey&&window.firebase))return false;
  var app=window.firebase.initializeApp(fc),auth=window.firebase.auth(),db=window.firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  var seen=false;try{seen=localStorage.getItem(CLOUD_FLAG)==='1'}catch(e){}
  var user=await new Promise(function(r){var u=auth.onAuthStateChanged(function(x){u();r(x)})});
  if(!user){
    if(seen&&!navigator.onLine){store.mode='offline';return true}
    await askLogin(auth);
  }
  store.fb=db;store.mode='cloud';
  try{localStorage.setItem(CLOUD_FLAG,'1')}catch(e){}
  store.downloads={save:async function(o){var a=document.createElement('a'),u=URL.createObjectURL(new Blob([o.data],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}};
  await fbMigrate();
  return true;
}
var localList=[];
function persistLocal(){localStorage.setItem(LS_KEY,JSON.stringify(localList))}
async function initStore(){
  try{if(await initFb())return}catch(e){}
  try{
    var c=window.claude;
    if(c&&c.use){
      var r=await Promise.all([c.use('db'),c.use('user'),c.use('assets'),c.use('downloads')]);
      store.assets=r[2]||null;store.downloads=r[3]||null;
      var uid=r[1]?await r[1].id():null;
      if(r[0]&&uid){store.col=r[0].collection('data/users/'+uid);store.mode='cloud';try{localStorage.setItem(CLOUD_FLAG,'1')}catch(e){}return}
    }
  }catch(e){}
  var seen=false;try{seen=localStorage.getItem(CLOUD_FLAG)==='1'}catch(e){}
  if(seen){store.mode='offline';return}
  store.mode='local';
  try{var raw=localStorage.getItem(LS_KEY);localList=raw?JSON.parse(raw):[]}catch(e){localList=[]}
}
function subscribe(cb){
  if(store.fb){
    var P=null,V=null,fail=function(e){cb(null,e)};
    var emit=function(){if(!P||!V)return;cb(P.map(function(p){var v=V[p.id]||null;if(p.sold){p.sale=v}else{p.sale=null;p.reservedFor=(p.reserved&&v&&v.reservedFor)||''}return p}))};
    store.fb.collection('pecas').orderBy('createdAt').onSnapshot(function(sn){P=sn.docs.map(function(d){return fbDoc(d.id,d.data())});emit()},fail);
    store.fb.collection('vendas').onSnapshot(function(sn){V={};sn.docs.forEach(function(d){V[d.id]=d.data()});emit()},fail);
    return;
  }
  if(store.mode==='cloud'){
    store.col.onSnapshot(function(snap){
      cb(snap.docs.map(function(d){var o=clone(d.data()||{});o.id=d.id;return o}));
    },function(err){cb(null,err)});
  }else cb(localList.slice());
}
async function storeSave(p){
  var data=clone(p);delete data.id;
  if(store.fb){await fbSave(p);return}
  if(store.mode==='cloud'){await store.col.doc(p.id).set(data);return}
  var prev=localList.slice(),i=localList.findIndex(function(x){return x.id===p.id});
  if(i>-1)localList[i]=clone(p);else localList.push(clone(p));
  try{persistLocal()}catch(e){localList=prev;throw e}
}
async function storeRemove(p){
  if(store.fb){await store.fb.collection('vendas').doc(p.id).delete();await store.fb.collection('pecas').doc(p.id).delete();return}
  if(store.mode==='cloud'){await store.col.doc(p.id).delete();return}
  var prev=localList.slice();
  localList=localList.filter(function(x){return x.id!==p.id});
  try{persistLocal()}catch(e){localList=prev;throw e}
}
function photoPlan(){if(store.fb)return {max:900,q:.75};return store.mode==='cloud'&&store.assets?{max:1200,q:.82}:{max:640,q:.7}}
function toDataURL(blob){return new Promise(function(res,rej){var f=new FileReader();f.onload=function(){res(f.result)};f.onerror=rej;f.readAsDataURL(blob)})}
async function uploadPhoto(blob){
  if(store.mode==='cloud'&&store.assets){var r=await store.assets.upload(blob);return {photoId:r.id,photoData:null}}
  return {photoId:null,photoData:await toDataURL(blob)};
}
async function deleteAsset(id){if(id)cacheDel(id);try{if(id&&store.assets)await store.assets.delete(id)}catch(e){}}
function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),i=new Image();i.onload=function(){URL.revokeObjectURL(u);res(i)};i.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
async function compress(file,plan){
  var img;
  try{img=await createImageBitmap(file)}catch(e){img=await loadImg(file)}
  var w0=img.width||img.naturalWidth,h0=img.height||img.naturalHeight;
  var k=Math.min(1,plan.max/Math.max(w0,h0));
  var w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  var blob=await new Promise(function(r){c.toBlob(r,'image/jpeg',plan.q)});
  if(!blob)throw new Error('blob');
  return blob;
}

/* ---------- State ---------- */
var S={pieces:[],loaded:false,loadErr:false,filter:'all',q:'',openId:null,mode:null,confirm:null,busy:false,err:'',pending:null,removePhoto:false,photoBusy:false,extras:[]};
var grid=$('#grid'),stateEl=$('#state'),dlg=$('#sheet'),sheet=$('#sheet-body');
var cur=function(){return S.pieces.find(function(x){return x.id===S.openId})};
var srcOf=function(p){return p.photoData||(p.photoId?(photoURL[p.photoId]||blobUrl(p.photoId)):'')};
function photoHTML(p,alt,loading){
  var s=srcOf(p);
  return s?'<img src="'+esc(s)+'" data-pid="'+esc(p.photoId||'')+'" alt="'+esc(alt)+'" loading="'+loading+'" decoding="async">':'<span class="noimg">Sem foto</span>';
}
document.addEventListener('error',function(e){
  var t=e.target;
  if(t&&t.tagName==='IMG'&&t.closest('.t-photo,.s-photo,.pf-frame')){
    var pid=t.dataset.pid;
    if(pid&&photoURL[pid]&&t.getAttribute('src')!==photoURL[pid]){t.src=photoURL[pid];return}
    var ph=document.createElement('span');ph.className='noimg';ph.textContent='Foto indisponível';t.replaceWith(ph);
  }
},true);

function visible(){
  var q=norm(S.q.trim());
  return S.pieces.filter(function(p){
    if(S.filter==='sold'&&!p.sold)return false;
    if(S.filter==='avail'&&(p.sold||p.reserved))return false;
    if(S.filter==='res'&&!p.reserved)return false;
    return !q||norm(p.name).indexOf(q)>-1||norm(p.code).indexOf(q)>-1;
  }).sort(function(a,b){return String(b.createdAt||'').localeCompare(String(a.createdAt||''))});
}
function tileHTML(p){
  var sold=!!p.sold,b=sold&&p.sale&&p.sale.buyer?p.sale.buyer:'';
  var res=!sold&&p.reserved,status=sold?('Vendida'+(b?' para '+esc(b):'')):res?('Reservada'+(p.reservedFor?' para '+esc(p.reservedFor):'')):'Disponível';
  var due=sold&&p.sale&&p.sale.dueDate?'<span class="t-due">Prazo '+fmtDate(p.sale.dueDate)+'</span>':'';
  return '<li><button type="button" class="tile'+(sold?' is-sold':'')+'" data-act="open" data-id="'+esc(p.id)+'">'
    +'<span class="t-photo">'+photoHTML(p,'','lazy')+'</span>'
    +'<span class="t-name">'+esc(p.name)+'</span>'
    +'<span class="t-meta"><span class="t-code">'+esc(p.code)+'</span><span class="t-price">'+money(p.price)+'</span></span>'
    +'<span class="t-comm">Comissão <span>'+money(commission(p.price))+'</span></span>'
    +'<span class="t-status'+(sold?' ok':res?' res':'')+'">'+status+'</span>'+due+'</button></li>';
}
function render(){
  var total=S.pieces.length,show=S.loaded&&!S.loadErr&&total>0;
  $('#totals').hidden=!show;$('#controls').hidden=!show;$('#foot').hidden=!(show&&store.downloads);
  if(show){
    var stock=0,sold=0,ns=0,nr=0;
    S.pieces.forEach(function(p){if(p.sold){sold+=p.price||0;ns++}else{stock+=p.price||0;if(p.reserved)nr++}});
    $('#t-count').textContent=total;$('#t-stock').textContent=money(stock);$('#t-sold').textContent=money(sold);$('#t-comm').textContent=money(commission(sold));
    $('#c-all').textContent=total;$('#c-avail').textContent=total-ns-nr;$('#c-res').textContent=nr;$('#c-sold').textContent=ns;
    document.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.v===S.filter))});
  }
  if(!S.loaded){
    grid.hidden=false;stateEl.hidden=true;grid.setAttribute('aria-busy','true');
    var sk='';for(var i=0;i<6;i++)sk+='<li class="sk" aria-hidden="true"><span class="sk-ph"></span><span class="sk-l"></span><span class="sk-l s"></span></li>';
    grid.innerHTML=sk;return;
  }
  grid.setAttribute('aria-busy','false');
  updatePayNote();updateBackupNote();
  if(S.loadErr){
    grid.hidden=true;stateEl.hidden=false;
    stateEl.innerHTML='<h2>Não consegui carregar as peças</h2><p>Atualize a página para tentar de novo. Suas peças continuam salvas.</p>';return;
  }
  if(!total){
    grid.hidden=true;stateEl.hidden=false;
    stateEl.innerHTML='<div class="empty"><svg class="badge" viewBox="43 35 1163 1165" role="img" aria-label="Olivir Semi Jóias"><circle cx="624.5" cy="617.5" r="581.5" fill="var(--gold)"/><circle cx="624.5" cy="617.5" r="556" fill="none" stroke="var(--cream)" stroke-width="3"/><g fill="var(--cream)"><use href="#lg-neck"/><use href="#lg-word"/><use href="#lg-rest"/><use href="#lg-sub"/></g></svg>'
      +'<div><h2>Seu catálogo começa aqui</h2><p>Cadastre uma peça com foto, nome, código e preço. Quando vender, marque a peça e anote para quem foi e como será o pagamento.</p>'
      +'<button type="button" class="btn btn-gold" data-act="new">Nova peça</button></div></div>';return;
  }
  var list=visible();
  if(!list.length){
    grid.hidden=true;stateEl.hidden=false;
    stateEl.innerHTML='<h2>Nenhuma peça encontrada</h2><p>Mude o filtro ou procure por outro nome ou código.</p><button type="button" class="btn btn-ghost" data-act="clear">Limpar busca e filtro</button>';return;
  }
  stateEl.hidden=true;grid.hidden=false;grid.innerHTML=list.map(tileHTML).join('');
}
function upsert(p){
  var i=S.pieces.findIndex(function(x){return x.id===p.id});
  if(i>-1)S.pieces[i]=p;else S.pieces.push(p);
  render();
}
function toast(msg){
  var old=$('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove()},3200);
}

/* ---------- Sheet views ---------- */
function saleSummary(s){
  s=s||{};
  var rows='<dt>Vendida para</dt><dd>'+esc(s.buyer||'Sem nome')+'</dd>';
  if(s.soldAt)rows+='<dt>Data da venda</dt><dd>'+fmtDate(s.soldAt)+'</dd>';
  if(s.dueDate)rows+='<dt>Prazo de pagamento</dt><dd>'+fmtDate(s.dueDate)+'</dd>';
  if(s.method)rows+='<dt>Pagamento</dt><dd>'+esc(methodLabel(s))+'</dd>';
  if(s.paid===true)rows+='<dt>Situação</dt><dd>Recebido'+(s.paidAt?' em '+fmtDate(s.paidAt):'')+'</dd>';
  else if(s.paid===false){var di=dueInfo(s);rows+='<dt>Situação</dt><dd class="'+(di.bad?'due-bad':'')+'">A receber · '+esc(di.t)+'</dd>'}
  if(s.notes)rows+='<dt>Anotações</dt><dd>'+esc(s.notes)+'</dd>';
  return '<dl class="sale">'+rows+'</dl>';
}
function actionsHTML(p){
  var d=S.busy?' disabled':'';
  var errP=S.err?'<p class="err" role="alert">'+esc(S.err)+'</p>':'';
  if(store.mode==='offline')return '<p class="help">Sem conexão. Para editar ou vender, volte a ficar online e atualize a página.</p>';
  if(S.confirm==='delete')return errP+'<div class="confirm" role="alert"><p>Excluir esta peça? A foto e as anotações também serão apagadas.</p><div class="actions"><button type="button" class="btn btn-danger" data-act="do-delete"'+d+'>Excluir peça</button><button type="button" class="btn btn-ghost" data-act="cancel-confirm">Manter</button></div></div>';
  if(S.confirm==='unsell')return errP+'<div class="confirm" role="alert"><p>Desfazer a venda? A peça volta para disponível e as anotações da venda são apagadas.</p><div class="actions"><button type="button" class="btn btn-danger" data-act="do-unsell"'+d+'>Desfazer venda</button><button type="button" class="btn btn-ghost" data-act="cancel-confirm">Manter</button></div></div>';
  if(S.confirm==='reserve')return errP+'<div class="confirm"><div class="field"><label for="rs-name">Reservar para quem? (opcional)</label><input id="rs-name" type="text" autocomplete="off" data-autofocus></div><div class="actions"><button type="button" class="btn btn-gold" data-act="do-reserve"'+d+'>Reservar</button><button type="button" class="btn btn-ghost" data-act="cancel-confirm">Cancelar</button></div></div>';

function openSheet(mode,id){

/* ---------- Form helpers ---------- */
function setErr(id,msg){
  var e=$('#'+id+'-err'),f=$('#'+id);
  if(e){e.textContent=msg||'';e.hidden=!msg}
  if(f){if(msg)f.setAttribute('aria-invalid','true');else f.removeAttribute('aria-invalid')}
  return !msg;
}
function formErr(msg){var e=$('#form-err');if(e){e.textContent=msg||'';e.hidden=!msg}}
function setBusy(btnId,on,label,idle){
  S.busy=on;var b=$('#'+btnId);if(b){b.disabled=on;b.textContent=on?label:idle}
}

async function onFile(inp){

async function submitPiece(){
  if(S.busy)return;
  if(S.photoBusy){formErr('Aguarde a foto terminar de carregar.');return}
  var p=S.mode==='edit'?cur():null;
  var name=$('#pf-name').value.trim(),code=$('#pf-code').value.trim().toUpperCase(),price=parsePrice($('#pf-price').value);
  var dup=S.pieces.some(function(x){return norm(x.code)===norm(code)&&(!p||x.id!==p.id)});
  var ok=true;
  ok=setErr('pf-name',name?'':'Informe o nome da peça.')&&ok;
  ok=setErr('pf-code',!code?'Informe o código da peça.':dup?'Já existe uma peça com esse código.':'')&&ok;
  ok=setErr('pf-price',isNaN(price)||price<=0?'Informe um preço maior que zero. Exemplo: 1.290,00':'')&&ok;
  if(!ok){var bad=sheet.querySelector('[aria-invalid=true]');if(bad)bad.focus();return}
  formErr('');setBusy('pf-save',true,'Salvando…','Salvar peça');
  try{
    var next=p?clone(p):{id:newId(),createdAt:new Date().toISOString(),sold:false,sale:null,photoId:null,photoData:null};
    var oldPhoto=next.photoId;
    if(S.pending){var up=await uploadPhoto(S.pending.blob);next.photoId=up.photoId;next.photoData=up.photoData;if(up.photoId)await cachePut(up.photoId,S.pending.blob)}
    else if(S.removePhoto){next.photoId=null;next.photoData=null}
    next.name=name;next.code=code;next.price=price;next.category=$('#pf-cat').value||'';next.photoExtra=S.extras.slice();
    await storeSave(next);
    if(oldPhoto&&oldPhoto!==next.photoId)deleteAsset(oldPhoto);
    upsert(next);
    if(p){S.pending&&URL.revokeObjectURL(S.pending.url);S.pending=null;backToDetail();toast('Peça atualizada')}
    else{closeSheet();toast('Peça cadastrada')}
  }catch(e){
    formErr(store.mode==='local'?'Não coube neste navegador. Tente uma foto menor ou exclua alguma peça.':'Não consegui salvar. Confira a conexão e tente de novo.');
  }finally{S.busy=false;var b=$('#pf-save');if(b){b.disabled=false;b.textContent='Salvar peça'}}
}

async function submitSale(f){
  if(S.busy)return;
  var p=cur();if(!p)return;
  var buyer=$('#sf-buyer').value.trim(),due=$('#sf-due').value,notes=$('#sf-notes').value.trim();
  var chk=f.querySelector('input[name=method]:checked'),method=chk?chk.value:'';
  var inst=parseInt($('#sf-inst').value,10),ok=true;
  ok=setErr('sf-buyer',buyer?'':'Informe para quem a peça foi vendida.')&&ok;
  ok=setErr('sf-method',method?'':'Escolha como será o pagamento.')&&ok;
  ok=setErr('sf-inst',method==='parcelado'&&!(inst>=2&&inst<=48)?'Informe entre 2 e 48 parcelas.':'')&&ok;
  if(!ok){var bad=sheet.querySelector('[aria-invalid=true]');if(bad)bad.focus();else $('#sf-method-err').scrollIntoView({block:'center'});return}
  formErr('');var idle=p.sold?'Salvar venda':'Confirmar venda';setBusy('sf-save',true,'Salvando…',idle);
  try{
    var next=clone(p);
    next.sold=true;next.reserved=false;next.reservedFor='';
    var paid=$('#sf-paid').checked;
    next.sale={buyer:buyer,dueDate:due||null,method:method,installments:method==='parcelado'?inst:null,notes:notes,soldAt:(p.sale&&p.sale.soldAt)||new Date().toISOString(),paid:paid,paidAt:paid?((p.sale&&p.sale.paidAt)||new Date().toISOString()):null};
    await storeSave(next);upsert(next);backToDetail();toast(p.sold?'Venda atualizada':'Peça marcada como vendida');
  }catch(e){formErr('Não consegui salvar. Confira a conexão e tente de novo.')}
  finally{S.busy=false;var b=$('#sf-save');if(b){b.disabled=false;b.textContent=idle}}
}

async function doUnsell(){
  var p=cur();if(!p||S.busy)return;
  S.busy=true;renderSheet();
  try{var next=clone(p);next.sold=false;next.sale=null;next.reserved=false;next.reservedFor='';await storeSave(next);upsert(next);S.busy=false;backToDetail();toast('Venda desfeita')}
  catch(e){S.busy=false;S.err='Não consegui desfazer a venda. Tente de novo.';renderSheet()}
}
async function doDelete(){
  var p=cur();if(!p||S.busy)return;
  S.busy=true;renderSheet();
  try{
    await storeRemove(p);
    S.pieces=S.pieces.filter(function(x){return x.id!==p.id});
    if(p.photoId)deleteAsset(p.photoId);
    S.busy=false;render();closeSheet();toast('Peça excluída');
  }catch(e){S.busy=false;S.err='Não consegui excluir. Tente de novo.';renderSheet()}
}

async function exportCsv(){
  var dl=store.downloads;if(!dl)return;
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
  var head=['Código','Nome','Preço','Situação','Vendida para','Data da venda','Prazo de pagamento','Pagamento','Anotações'];
  var rows=S.pieces.slice().sort(function(a,b){return String(a.code).localeCompare(String(b.code))}).map(function(p){

  });

/* ---------- Reservar, receber, backup ---------- */
async function doReserve(on){
  var p=cur();if(!p||S.busy)return;
  var name=on?($('#rs-name')?$('#rs-name').value.trim():''):'';
  S.busy=true;renderSheet();
  try{
    var nx=clone(p);nx.reserved=on;nx.reservedFor=on?name:'';
    await storeSave(nx);upsert(nx);S.busy=false;backToDetail();toast(on?'Peça reservada':'Reserva removida');
  }catch(e){S.busy=false;S.err='Não consegui salvar. Confira a conexão e tente de novo.';renderSheet()}
}
function todayMs(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function dueInfo(s){
  if(!s||!s.dueDate)return {k:'none',t:'sem prazo',bad:false,days:null};
  var m=String(s.dueDate).split('-'),d=new Date(Number(m[0]),Number(m[1])-1,Number(m[2])).getTime();
  var n=Math.round((d-todayMs())/864e5);
  if(n<0)return {k:'late',t:'atrasado há '+(-n)+(n===-1?' dia':' dias'),bad:true,days:n};
  if(n===0)return {k:'today',t:'vence hoje',bad:false,days:0};
  return {k:'soon',t:'vence em '+n+(n===1?' dia':' dias'),bad:false,days:n};
}
function pendingList(){
  return S.pieces.filter(function(p){return p.sold&&p.sale&&p.sale.paid===false}).sort(function(a,b){
    var x=dueInfo(a.sale),y=dueInfo(b.sale);
    var kx=x.days==null?1e9:x.days,ky=y.days==null?1e9:y.days;return kx-ky;
  });
}
function updatePayNote(){
  var el=$('#paynote'),l=pendingList();
  if(!S.loaded||S.loadErr||!l.length){el.hidden=true;return}
  var sum=0,late=0,today=0;
  l.forEach(function(p){sum+=p.price||0;var i=dueInfo(p.sale);if(i.k==='late')late++;else if(i.k==='today')today++});
  var sub=[];if(late)sub.push(late+(late===1?' atrasado':' atrasados'));if(today)sub.push(today+(today===1?' vence hoje':' vencem hoje'));
  el.innerHTML='<span><span class="lbl">A receber</span><span class="sub'+(late?' bad':'')+'">'+(sub.length?sub.join(' · '):l.length+(l.length===1?' pagamento pendente':' pagamentos pendentes'))+'</span></span><b>'+money(sum)+'</b>';
  el.hidden=false;
}
var payDlg=$('#pay'),payBody=$('#pay-body');
function renderPay(){
  var l=pendingList();
  if(!l.length){if(payDlg.open)payDlg.close();return}
  var sum=0;l.forEach(function(p){sum+=p.price||0});
  payBody.innerHTML='<div class="rv"><h2 id="pay-title">A receber</h2><p class="help">Total pendente: <b>'+money(sum)+'</b>. Toque em Recebido quando o pagamento cair.</p><ul class="rv-list">'
    +l.map(function(p){
      var i=dueInfo(p.sale),src=srcOf(p);
      return '<li><div class="rv-row" style="grid-template-columns:56px minmax(0,1fr) auto;cursor:default"><span class="rv-th">'+(src?'<img src="'+esc(src)+'" alt="" decoding="async">':'')+'</span>'
        +'<span><span class="rv-n">'+esc((p.sale&&p.sale.buyer)||'Sem nome')+'</span><br><span class="rv-m">'+esc(p.name)+' · '+esc(p.code)+'</span><br><span class="rv-m'+(i.bad?' due-bad':'')+'">'+money(p.price)+' · '+esc(i.t)+'</span></span>'
        +'<button type="button" class="btn btn-gold" style="min-height:40px;padding:0 12px" data-pay="'+esc(p.id)+'">Recebido</button></div></li>';
    }).join('')+'</ul><div class="rv-act"><button type="button" class="btn btn-ghost" data-pay="close">Fechar</button></div></div>';
}
async function markPaid(p){
  if(!p||S.busy)return;
  S.busy=true;
  try{
    var nx=clone(p);nx.sale.paid=true;nx.sale.paidAt=new Date().toISOString();
    await storeSave(nx);upsert(nx);S.busy=false;toast('Pagamento registrado');
    if(dlg.open&&S.openId===p.id)renderSheet();

payDlg.addEventListener('click',function(e){

function openPay(){
  if(store.mode==='offline'){toast('Sem conexão. Volte a ficar online para registrar pagamentos.');return}
  if(!pendingList().length)return;renderPay();if(!payDlg.open)payDlg.showModal();
}

/* Backup */
var BK_LAST='ouro-offir:last-backup',BK_BASE='ouro-offir:backup-base',BK_SNZ='ouro-offir:backup-snooze',BK_DAYS=30;
function lsGet(k){try{return Number(localStorage.getItem(k))||0}catch(e){return 0}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function updateBackupNote(){
  var el=$('#bknote');
  if(!S.loaded||S.loadErr||!S.pieces.length||store.mode==='offline'){el.hidden=true;return}
  if(!lsGet(BK_BASE))lsSet(BK_BASE,Date.now());
  var last=lsGet(BK_LAST)||lsGet(BK_BASE),days=Math.floor((Date.now()-last)/864e5);
  if(days<BK_DAYS||Date.now()<lsGet(BK_SNZ)){el.hidden=true;return}
  el.innerHTML='<p>'+(lsGet(BK_LAST)?'Faz '+days+' dias que você não baixa um backup do catálogo.':'Você ainda não baixou um backup do catálogo.')+' Ele guarda as peças, as fotos e as vendas.</p><div class="acts"><button type="button" class="btn btn-gold" data-act="backup">Baixar backup</button><button type="button" class="link" data-act="backup-later">Depois</button></div>';
  el.hidden=false;
}
function downloadText(name,data,mime){
  var a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:mime}));
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
}
function doBackup(){
  var data=JSON.stringify({app:'olivir-catalogo',version:1,exportedAt:new Date().toISOString(),pieces:S.pieces.map(clone)});
  downloadText('olivir-backup-'+new Date().toISOString().slice(0,10)+'.json',data,'application/json');
  lsSet(BK_LAST,Date.now());updateBackupNote();toast('Backup baixado');
}
var restoreList=null;
function onBackupFile(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result),l=o&&o.pieces;
      if(!Array.isArray(l)||!l.length||!l.every(function(p){return p&&p.id&&p.name&&p.code}))throw new Error('x');
      restoreList=l;M.view='restore';M.err='';renderMenu();if(!menuDlg.open)menuDlg.showModal();
    }catch(e){restoreList=null;M.view='menu';renderMenu();if(!menuDlg.open)menuDlg.showModal();toast('Esse arquivo não parece um backup do catálogo.')}
    inp.value='';
  };
  r.onerror=function(){toast('Não consegui ler o arquivo.');inp.value=''};
  r.readAsText(f);
}
async function runRestore(){
  if(!restoreList||M.busy)return;
  M.busy=true;M.err='';renderMenu();
  try{
    for(var i=0;i<restoreList.length;i++){var p=restoreList[i];await storeSave(p);upsert(p)}
    M.busy=false;restoreList=null;menuDlg.close();toast('Backup restaurado');
  }catch(e){M.busy=false;M.err='Não consegui restaurar tudo. Confira a conexão e tente de novo.';renderMenu()}
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  if(e.target===dlg){closeSheet();return}
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(store.mode==='offline'&&(a==='new'||a==='edit'||a==='sell'||a==='edit-sale')){toast('Sem conexão. Volte a ficar online para editar.');return}
  if(a==='new')openSheet('new');
  else if(a==='open')openSheet('detail',t.dataset.id);
  else if(a==='close')closeSheet();
  else if(a==='cancel'){S.mode==='new'?closeSheet():backToDetail()}
  else if(a==='edit')openSheet('edit',S.openId);
  else if(a==='sell'||a==='edit-sale'){S.mode='sale';S.err='';renderSheet()}
  else if(a==='ask-delete'){S.confirm='delete';S.err='';renderSheet()}
  else if(a==='ask-unsell'){S.confirm='unsell';S.err='';renderSheet()}
  else if(a==='ask-reserve'){S.confirm='reserve';S.err='';renderSheet()}
  else if(a==='do-reserve')doReserve(true);
  else if(a==='do-unreserve')doReserve(false);
  else if(a==='mark-paid')markPaid(cur());
  else if(a==='gal'){var pp=cur();if(pp){var all=[srcOf(pp)].concat(pp.photoExtra||[]).filter(Boolean),ph=$('#s-photo');if(ph&&all[t.dataset.i]){ph.innerHTML='<img src="'+esc(all[t.dataset.i])+'" alt="Foto de '+esc(pp.name)+'">';document.querySelectorAll('.gal button').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))})}}}
  else if(a==='rm-extra'){S.extras.splice(Number(t.dataset.i),1);var bx=$('#pf-xbox');if(bx)bx.innerHTML=extrasHTML()}
  else if(a==='cancel-confirm'){S.confirm=null;S.err='';renderSheet()}
  else if(a==='do-delete')doDelete();
  else if(a==='do-unsell')doUnsell();
  else if(a==='remove-photo'){
    if(S.pending){URL.revokeObjectURL(S.pending.url);S.pending=null}
    S.removePhoto=true;$('#pf-frame').innerHTML='<span class="noimg">Sem foto</span>';t.hidden=true;$('#pf-status').textContent='A foto será removida ao salvar.';
  }
  else if(a==='filter'){S.filter=t.dataset.v;render()}
  else if(a==='clear'){S.filter='all';S.q='';$('#q').value='';render()}
  else if(a==='export')exportCsv();
  else if(a==='review')openReview(true);
  else if(a==='menu')openMenu();
  else if(a==='pay')openPay();
  else if(a==='backup')doBackup();
  else if(a==='backup-later'){lsSet(BK_SNZ,Date.now()+7*864e5);updateBackupNote()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='piece-form')submitPiece();
  else if(e.target.id==='sale-form')submitSale(e.target);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='pf-file')onFile(t);
  else if(t.id==='pf-extra')onExtra(t);
  else if(t.id==='bk-file')onBackupFile(t);
  else if(t.name==='method'){$('#sf-inst-row').hidden=t.value!=='parcelado';setErr('sf-method','')}
});
$('#q').addEventListener('input',function(e){S.q=e.target.value;render()});


/* ---------- Revisão de peças antigas (a cada 3 meses) ---------- */
/* Entram: peças NÃO vendidas e com mais de 90 dias desde o cadastro (ou desde a última revisão em que foram mantidas).
   Peças novas e peças vendidas nunca entram. Nada é apagado sem confirmação do vendedor. */
var RV_DAY=864e5,RV_AGE=90*RV_DAY,RV_SNOOZE='ouro-offir:review-snooze',rvShown=false;
var R={keep:{},step:'pick',busy:false,err:'',list:[]};
var rvDlg=$('#review'),rvBody=$('#rv-body');
function tms(v){if(typeof v==='number')return v;var n=Date.parse(v);return isNaN(n)?0:n}
function rvBase(p){return Math.max(tms(p.createdAt),tms(p.reviewedAt))}
function staleList(){var now=Date.now();return S.pieces.filter(function(p){var b=rvBase(p);return !p.sold&&!p.reserved&&b>0&&now-b>RV_AGE}).sort(function(a,b){return rvBase(a)-rvBase(b)})}
function monthsAgo(p){var m=Math.floor((Date.now()-rvBase(p))/(30*RV_DAY));return m<=1?'há 3 meses':'há '+m+' meses'}
function rvSnoozeGet(){try{return Number(localStorage.getItem(RV_SNOOZE))||0}catch(e){return 0}}
function rvSnoozeSet(){try{localStorage.setItem(RV_SNOOZE,String(Date.now()+3*RV_DAY))}catch(e){}}
function maybeReview(){
  if(rvShown||store.mode==='offline'||!S.loaded||rvDlg.open||dlg.open)return;
  if(Date.now()<rvSnoozeGet())return;
  if(!staleList().length)return;
  rvShown=true;openReview(false);
}
function openReview(manual){
  if(store.mode==='offline'){toast('Sem conexão. Volte a ficar online para revisar.');return}
  var l=staleList();
  if(!l.length){if(manual)toast('Nenhuma peça com mais de 3 meses em estoque.');return}
  R={keep:{},step:'pick',busy:false,err:'',list:l};
  renderReview();
  if(!rvDlg.open)rvDlg.showModal();
}
function rvCounts(){var k=0;R.list.forEach(function(p){if(R.keep[p.id])k++});return {keep:k,del:R.list.length-k}}
function rvLabel(c){return c.del?'Continuar':'Manter todas'}
function rvSumText(c){return 'Manter '+c.keep+' · Apagar '+c.del}
function renderReview(){
  var n=R.list.length,c=rvCounts();
  if(R.step==='pick'){
    rvBody.innerHTML='<div class="rv"><h2 id="rv-title">Revisão de peças antigas</h2>'
      +'<p class="help">'+(n===1?'Esta peça está':'Estas '+n+' peças estão')+' há mais de 3 meses no catálogo sem venda. Se já voltaram para a fábrica, deixe sem marcar para apagar. <b>Marque as que você quer manter.</b> Peças vendidas e peças novas não entram aqui.</p>'
      +'<div class="rv-tools"><button type="button" class="link" data-rv="all">Manter todas</button><button type="button" class="link" data-rv="none">Desmarcar todas</button><button type="button" class="link" data-rv="csv">Baixar lista antes</button></div>'
      +'<ul class="rv-list">'+R.list.map(function(p){
        var src=srcOf(p);
        return '<li><label class="rv-row'+(R.keep[p.id]?' keep':'')+'"><input type="checkbox" data-keep="'+esc(p.id)+'"'+(R.keep[p.id]?' checked':'')+' aria-label="Manter '+esc(p.name)+'">'
          +'<span class="rv-th">'+(src?'<img src="'+esc(src)+'" alt="" loading="lazy" decoding="async">':'')+'</span>'
          +'<span><span class="rv-n">'+esc(p.name)+'</span><br><span class="rv-m">'+esc(p.code)+' · '+monthsAgo(p)+'</span></span></label></li>';
      }).join('')+'</ul>'
      +'<p class="rv-sum" id="rv-sum" aria-live="polite">'+rvSumText(c)+'</p>'
      +'<p class="err" id="rv-err" role="alert">'+esc(R.err)+'</p>'
      +'<div class="rv-act"><button type="button" class="btn btn-gold" id="rv-go" data-rv="go">'+rvLabel(c)+'</button><button type="button" class="btn btn-ghost" data-rv="later">Decidir depois</button></div></div>';
  }else{
    var del=R.list.filter(function(p){return !R.keep[p.id]});
    rvBody.innerHTML='<div class="rv"><h2 id="rv-title">Apagar '+del.length+(del.length===1?' peça?':' peças?')+'</h2>'
      +'<p class="help">As fotos e as informações '+(del.length===1?'dessa peça serão apagadas':'dessas peças serão apagadas')+' para sempre. '+(c.keep?c.keep+(c.keep===1?' peça será mantida.':' peças serão mantidas.'):'Nenhuma peça será mantida.')+'</p>'
      +'<ul class="rv-list">'+del.map(function(p){return '<li class="rv-row" style="grid-template-columns:56px minmax(0,1fr);cursor:default"><span class="rv-th">'+(srcOf(p)?'<img src="'+esc(srcOf(p))+'" alt="" decoding="async">':'')+'</span><span><span class="rv-n">'+esc(p.name)+'</span><br><span class="rv-m">'+esc(p.code)+'</span></span></li>'}).join('')+'</ul>'
      +'<p class="err" id="rv-err" role="alert">'+esc(R.err)+'</p>'
      +'<div class="rv-act"><button type="button" class="btn btn-danger" id="rv-do" data-rv="do"'+(R.busy?' disabled':'')+'>'+(R.busy?'Apagando…':'Apagar '+del.length+(del.length===1?' peça':' peças'))+'</button><button type="button" class="btn btn-ghost" data-rv="back"'+(R.busy?' disabled':'')+'>Voltar</button></div></div>';
  }
}
function rvUpdate(){
  var c=rvCounts(),a=$('#rv-sum'),b=$('#rv-go');
  if(a)a.textContent=rvSumText(c);if(b)b.textContent=rvLabel(c);
}
async function rvRun(){
  if(R.busy)return;
  R.busy=true;R.err='';renderReview();
  var now=new Date().toISOString(),failed=false;
  try{
    for(var i=0;i<R.list.length;i++){
      var p=R.list[i];
      if(R.keep[p.id]){var nx=clone(p);nx.reviewedAt=now;await storeSave(nx);upsert(nx)}
    }
    for(var j=0;j<R.list.length;j++){
      var d=R.list[j];if(R.keep[d.id])continue;
      await storeRemove(d);
      S.pieces=S.pieces.filter(function(x){return x.id!==d.id});
      if(d.photoId)deleteAsset(d.photoId);
    }
  }catch(e){failed=true}
  R.busy=false;
  render();
  if(failed){
    R.list=staleList();R.list.forEach(function(p){});R.step='pick';R.keep={};
    R.err='Não consegui concluir. Confira a conexão e tente de novo. Nada foi apagado além do que já saiu da lista.';
    if(!R.list.length){rvDlg.close();return}
    renderReview();return;
  }
  rvDlg.close();toast('Revisão concluída');
}
rvDlg.addEventListener('click',function(e){
  if(e.target===rvDlg&&!R.busy){rvDlg.close();return}
  var t=e.target.closest('[data-rv]');if(!t)return;
  var a=t.dataset.rv;
  if(R.busy)return;
  if(a==='all'||a==='none'){R.list.forEach(function(p){R.keep[p.id]=a==='all'});renderReview()}
  else if(a==='csv')exportCsv();
  else if(a==='later')rvDlg.close();
  else if(a==='go'){if(rvCounts().del){R.step='confirm';R.err='';renderReview();rvBody.scrollIntoView&&rvDlg.scrollTo(0,0)}else rvRun()}
  else if(a==='back'){R.step='pick';R.err='';renderReview()}
  else if(a==='do')rvRun();
});
rvDlg.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.keep)return;
  R.keep[t.dataset.keep]=t.checked;
  var row=t.closest('.rv-row');if(row)row.classList.toggle('keep',t.checked);
  rvUpdate();
});
rvDlg.addEventListener('cancel',function(e){if(R.busy)e.preventDefault()});
rvDlg.addEventListener('close',rvSnoozeSet);


/* ---------- Menu: Sobre e Contato ---------- */
var ABOUT_KEY='ouro-offir:sobre',ABOUT={text:''},menuDlg=$('#menu'),menuBody=$('#menu-body'),M={view:'menu',err:'',busy:false};
function shareHref(){return 'https://wa.me/?text='+encodeURIComponent('Conheça o catálogo da Olivir Semi Jóias: '+location.origin+'/catalogo.html')}
function waHref(){var n=String((CFG&&CFG.whatsapp)||'').replace(/\D/g,'');return n?'https://wa.me/'+n:''}
function aboutMirror(t){try{localStorage.setItem(ABOUT_KEY,t)}catch(e){}}
function aboutInit(){
  try{ABOUT.text=localStorage.getItem(ABOUT_KEY)||''}catch(e){}
  if(store.fb&&store.mode==='cloud'){
    store.fb.collection('config').doc('sobre').onSnapshot(function(d){
      if(!d.exists&&d.metadata&&d.metadata.fromCache)return;
      var t=d.exists?String(d.data().text||''):'';
      ABOUT.text=t;aboutMirror(t);
      if(menuDlg.open&&M.view==='about')renderMenu();
    },function(){});
  }
}
async function aboutSave(t){
  if(store.fb&&store.mode==='cloud')await store.fb.collection('config').doc('sobre').set({text:t,updatedAt:new Date().toISOString()});
  ABOUT.text=t;aboutMirror(t);
}
function openMenu(){M={view:'menu',err:'',busy:false};renderMenu();if(!menuDlg.open)menuDlg.showModal()}
function renderMenu(){
  var h='<div class="mn">';
  if(M.view==='menu'){
    var w=waHref();
    h+='<div class="mn-top"><span class="mn-title">Menu</span><button type="button" class="link" data-mn="close">Fechar</button></div>'
      +'<div class="mn-list"><button type="button" class="mn-item" data-mn="about">Sobre</button>'
      +(w?'<a class="mn-item" href="'+esc(w)+'" target="_blank" rel="noopener">Contato <small>WhatsApp</small></a>':'')
      +'<a class="mn-item" href="'+esc(shareHref())+'" target="_blank" rel="noopener">Compartilhar catálogo <small>WhatsApp</small></a>'
      +'<button type="button" class="mn-item" data-mn="backup">Baixar backup <small>.json</small></button>'
      +'<button type="button" class="mn-item" data-mn="restore">Restaurar backup</button></div>';
  }else if(M.view==='restore'){
    var n=restoreList?restoreList.length:0;
    h+='<div class="mn-top"><span class="mn-title">Restaurar backup</span></div>'
      +'<p class="help">O arquivo tem '+n+(n===1?' peça':' peças')+'. Peças com o mesmo código interno serão substituídas pelas do arquivo. As outras continuam como estão.</p>'
      +'<p class="err" role="alert">'+esc(M.err)+'</p>'
      +'<button type="button" class="btn btn-gold" data-mn="do-restore"'+(M.busy?' disabled':'')+'>'+(M.busy?'Restaurando…':'Restaurar agora')+'</button><button type="button" class="btn btn-ghost" data-mn="cancel-restore"'+(M.busy?' disabled':'')+'>Cancelar</button>';
  }else if(M.view==='about'){
    h+='<div class="mn-top"><button type="button" class="link" data-mn="back">Voltar</button><button type="button" class="link" data-mn="close">Fechar</button></div>'
      +'<h2>Sobre</h2>'
      +(ABOUT.text?'<p class="mn-text">'+esc(ABOUT.text)+'</p>':'<p class="help">Ainda sem texto. Toque em Editar texto para escrever uma pequena apresentação. Ela aparece no menu do catálogo dos compradores.</p>')
      +'<button type="button" class="btn btn-gold" data-mn="edit">Editar texto</button>';
  }else{
    h+='<div class="mn-top"><span class="mn-title">Editar sobre</span></div>'
      +'<div class="field"><label for="mn-text">Texto que os compradores vão ler</label><textarea id="mn-text" maxlength="800" rows="9"></textarea><span class="help">Até 800 caracteres.</span></div>'
      +'<p class="err" id="mn-err" role="alert">'+esc(M.err)+'</p>'
      +'<button type="button" class="btn btn-gold" id="mn-save" data-mn="save">Salvar</button><button type="button" class="btn btn-ghost" data-mn="about">Cancelar</button>';
  }
  menuBody.innerHTML=h+'</div>';
  var ta=$('#mn-text');if(ta){ta.value=M.draft!=null?M.draft:ABOUT.text}
}
menuDlg.addEventListener('click',async function(e){
  if(e.target===menuDlg){menuDlg.close();return}
  var t=e.target.closest('[data-mn]');if(!t||M.busy)return;
  var a=t.dataset.mn;
  if(a==='close')menuDlg.close();
  else if(a==='back'){M.view='menu';renderMenu()}
  else if(a==='backup'){doBackup()}
  else if(a==='restore'){if(store.mode==='offline'){toast('Sem conexão. Volte a ficar online para restaurar.');return}$('#bk-file').click()}
  else if(a==='do-restore')runRestore();
  else if(a==='cancel-restore'){restoreList=null;M.view='menu';renderMenu()}
  else if(a==='about'){M.view='about';M.draft=null;M.err='';renderMenu()}
  else if(a==='edit'){
    if(store.mode==='offline'){toast('Sem conexão. Volte a ficar online para editar.');return}
    M.view='edit';M.err='';M.draft=null;renderMenu();var ta=$('#mn-text');if(ta)ta.focus();
  }
  else if(a==='save'){
    var txt=$('#mn-text').value.trim();
    M.busy=true;t.disabled=true;t.textContent='Salvando…';
    try{await aboutSave(txt);M.busy=false;M.view='about';M.err='';M.draft=null;renderMenu();toast('Texto salvo')}
    catch(err){M.busy=false;M.draft=txt;M.err='Não consegui salvar. Confira a conexão e tente de novo.';renderMenu()}
  }
});
/* ---------- Boot ---------- */
render();
var NOTICE={
  local:'Você está sem conexão com a sua conta. As peças e as fotos ficam salvas só neste navegador e não aparecem em outros aparelhos.',
  offline:'Sem conexão. Mostrando a última cópia salva neste aparelho, com as fotos. Para editar ou vender, volte a ficar online e atualize a página.'
};
function applyMode(){
  var n=$('#notice');n.textContent=NOTICE[store.mode]||'';n.hidden=!NOTICE[store.mode];
  document.body.classList.toggle('ro',store.mode==='offline');
}
function showOffline(){
  store.mode='offline';applyMode();
  metaGet().then(function(list){S.pieces=list||[];S.loadErr=!list;S.loaded=true;render()});
}
Promise.all([cacheLoad(),initStore()]).then(function(){
  applyMode();aboutInit();
  if(store.mode==='offline'){showOffline();return}
  subscribe(function(list,err){
    if(err){if(store.mode==='cloud')showOffline();else{S.loadErr=true;S.loaded=true;render()}return}
    S.pieces=list;S.loadErr=false;S.loaded=true;render();maybeReview();
    if(store.mode==='cloud'){
      metaPut(list);
      var keep={};list.forEach(function(p){if(p.photoId)keep[p.photoId]=1});
      cachePrune(keep);warm();
    }
  });
});
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
